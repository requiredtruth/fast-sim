name: Fast Sim release
on:
  push:
    branches: [main]
    paths: [RELEASE]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fast-sim-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and verify packages
        env:
          FAST_SIM_SIGNING_KEY: ${{ secrets.FAST_SIM_SIGNING_KEY }}
          FAST_SIM_KEYSTORE_PASSWORD: ${{ secrets.FAST_SIM_KEYSTORE_PASSWORD }}
        run: |
          if [[ -n "$FAST_SIM_SIGNING_KEY" ]]; then
            export FAST_SIM_KEYSTORE="$RUNNER_TEMP/fast-sim.p12"
            printf '%s' "$FAST_SIM_SIGNING_KEY" | base64 -d > "$FAST_SIM_KEYSTORE"
          fi
          bash scripts/package.sh
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(cat RELEASE)"
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "Fast Sim: Dustbound $tag" --notes-file RELEASE-NOTES.md
