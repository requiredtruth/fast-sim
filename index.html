<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172019"><title>Fast Sim · Dustbound</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#162019;color:#f4e9cd;font:15px system-ui;overscroll-behavior:none}canvas{width:100%;height:100dvh;display:block}header,footer,#hint,#panel{position:fixed}header{inset:0 0 auto;padding:18px clamp(10px,3vw,38px);background:linear-gradient(#121b16ea,transparent);display:flex;justify-content:space-between;gap:8px;pointer-events:none}header button{pointer-events:auto;white-space:nowrap}h1{font-size:clamp(17px,4vw,28px);letter-spacing:.13em;margin:0}small{letter-spacing:.1em;color:#f0cc87}#meters{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:7px;font-variant-numeric:tabular-nums}button,.file{background:#242f26;color:inherit;border:1px solid #8b9976;border-radius:6px;padding:9px 12px;font:inherit;cursor:pointer;touch-action:none}button:hover,button:focus-visible,.file:hover{background:#43503b}button:disabled{opacity:.45;cursor:default}footer{inset:auto 0 max(8px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;gap:4px;padding:0 8px;pointer-events:none}footer div{display:flex;gap:4px;flex-wrap:wrap}footer button{pointer-events:auto;background:#18241eea;min-width:38px}#hint{bottom:68px;left:50%;transform:translateX(-50%);text-align:center;background:#142018e8;border-radius:6px;padding:8px 12px;width:max-content;max-width:95vw}#panel{inset:12% 0 auto;margin:auto;width:min(560px,94vw);max-height:72dvh;overflow:auto;background:#17201af7;border:1px solid #aab291;border-radius:10px;padding:16px;box-shadow:0 12px 50px #0009}#panel h2{margin:0 0 10px}#panel p{margin:8px 0}#panel nav{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #576253}.row span{flex:1}#notice{color:#f1c677}#close{float:right}@media(max-width:500px){header{padding:10px}#hint{bottom:103px}footer{align-items:end}footer div{max-width:51%}footer button{padding:8px}}
</style></head><body>
<canvas id="world" aria-label="Procedural road and wilderness"></canvas>
<header><div><small>FAST SIM</small><h1>DUSTBOUND</h1><div id="meters"></div></div><div><button id="pack">Pack / Mods</button></div></header>
<div id="hint" role="status"></div>
<footer><div><button data-key="a" aria-label="Left">←</button><button data-key="w" aria-label="Forward">↑</button><button data-key="s" aria-label="Reverse">↓</button><button data-key="d" aria-label="Right">→</button></div><div><button id="interact">Use</button><button id="seat">Exit</button><button id="turn">Turn</button></div></footer>
<section id="panel" hidden aria-label="Game menu"><button id="close" aria-label="Close menu">×</button><h2 id="panelTitle"></h2><nav id="tabs"></nav><div id="content"></div><p id="notice" role="status"></p><input id="import" type="file" accept=".json,application/json" hidden></section>
<script>
'use strict';
const el = id => document.getElementById(id);
const canvas = el('world'), ctx = canvas.getContext('2d'), panel = el('panel');
const clamp = (value, low, high) => Math.max(low, Math.min(high, value));
const mix = (a,b,t) => a+(b-a)*t;
const hash = n => {
  n = Math.imul(n ^ (n >>> 16), 0x45d9f3b);
  n = Math.imul(n ^ (n >>> 16), 0x45d9f3b);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
};
const items = {
  water:['Water',.7,'drink',42], berries:['Berries',.2,'eat',14], rations:['Trail rations',.5,'eat',32],
  wood:['Firewood',1.2], scrap:['Scrap metal',.9], cloth:['Cloth',.2], herbs:['Medicinal leaves',.2],
  fuel:['Fuel can',2,'refuel',34], bandage:['Bandage',.2,'heal',32], kit:['Repair kit',1,'repair',38],
  tire:['Spare tire',2.5,'repair',26], seed:['Garden seeds',.1], vegetables:['Vegetables',.4,'eat',22],
  bottle:['Empty bottle',.1], fish:['River fish',.5], meal:['Camp meal',.6,'eat',52], bedroll:['Bedroll',1.4],
  jacket:['Rain jacket',.8], fishingRod:['Fishing rod',.9],
  filter:['Water filter',.6], lantern:['Lantern',.7]
};
const vehicles = {
  wagon:{name:'Cinder Wagon',color:'#a66244',cap:34,tank:85,speed:40},
  pickup:{name:'Juniper Pickup',color:'#557864',cap:55,tank:105,speed:34},
  camper:{name:'Mesa Camper',color:'#c6ae74',cap:85,tank:125,speed:29}
};
const recipes = {
  bandage:{cloth:1,herbs:1}, kit:{scrap:2,cloth:1}, bedroll:{cloth:3},
  filter:{scrap:1,cloth:2}, jacket:{cloth:3}, fishingRod:{wood:1,cloth:1,scrap:1}, lantern:{scrap:2,fuel:1}, meal:{fish:1,wood:1}
};
const loot = [['water','rations','cloth'],['fuel','scrap','tire'],['wood','berries','herbs','seed'],['bottle','fish','water']];
const newVehicle = (type,x,z) => ({type,x,z,fuel:vehicles[type].tank*.63,condition:100,cargo:{}});
const fresh = () => {
  const car = newVehicle('wagon',0,0);
  return {seed:Math.floor(Math.random()*2147483647),x:0,z:0,dir:1,day:0,hour:8,health:100,
    food:95,water:95,energy:95,driving:true,car,parked:{},bag:{water:2,rations:2,wood:2,bedroll:1},
    visited:{},camps:{},mods:[]};
};
const saveKey = 'fast-sim-dustbound-1';
let state = fresh(), status = '', statusUntil = 0, speed = 0, selectedTab = 'Pack', nightLamp = false;
try { const saved=JSON.parse(localStorage.getItem(saveKey)); if(saved?.car && saved?.parked && saved?.bag) state=saved; } catch {}
const save = (show = false) => {
  try {localStorage.setItem(saveKey,JSON.stringify(state)); if(show) say('Trip saved.');}
  catch {if(show) say('Local storage could not save this trip.');}
};
const say = message => {status=message;statusUntil=performance.now()+4200;el('notice').textContent=message;};
const def = id => items[id] || state.mods.find(mod=>mod.item.id===id)?.item.data;
const weight = bag => Object.entries(bag).reduce((sum,[id,n])=>sum+(def(id)?.[1]||0)*n,0);
const add = (bag,id,n) => {
  bag[id]=(bag[id]||0)+n;
  if(!bag[id]) delete bag[id];
};
const take = (id,n=1) => {
  if(weight(state.bag)+def(id)[1]*n>16.0001) return false;
  add(state.bag,id,n);return true;
};
const change = (key,n) => {state[key]=clamp(state[key]+n,0,100);};
const absoluteHour = () => state.day*24+state.hour;
const advance = hours => {
  state.hour += hours;state.day += Math.floor(state.hour/24);state.hour %= 24;
};
const road = z => 38*Math.sin(z/290+state.seed%41)-38*Math.sin(state.seed%41)+15*Math.sin(z/101);
const cell = n => hash(n+state.seed);
const weather = () => {
  const roll=cell(Math.floor(absoluteHour()/6)*977+Math.floor(state.z/900)*89);
  return roll<.11?'Dust':roll<.25?'Rain':'Clear';
};
const distance = obj => Math.hypot(obj.x-state.x,obj.z-state.z);
function stop(segment) {
  const index = ((segment%6)+6)%6, type = ['grove','shed','spring','wreck','grove','layby'][index];
  const z = segment*175+82, x = road(z)+(cell(segment*31)<.5?-1:1)*(16+cell(segment*41)*14);
  return {id:'stop:'+segment,type,x,z,size:type==='shed'?7:4,segment};
}
const nearbyCamp = () => Object.values(state.camps).find(camp=>distance(camp)<9);
function nearby() {
  const segment=Math.floor(state.z/175);
  const candidates=[...Object.values(state.camps),stop(segment-1),stop(segment),stop(segment+1),
    ...Object.entries(state.parked).map(([id,car])=>({id,type:'parked',x:car.x,z:car.z,car}))];
  if(!state.driving) candidates.push({type:'car',...state.car});
  const obj=candidates.filter(obj=>distance(obj)<9).sort((a,b)=>distance(a)-distance(b))[0];
  return obj;
}
const names = {grove:'Forage at the grove',shed:'Search the supply shed',spring:'Use the spring',
  wreck:'Salvage the wreck',layby:'Search the roadside shelter',camp:'Open camp',car:'Open vehicle cargo',parked:'Switch vehicles'};
function useWorld() {
  const obj=nearby();
  if(!obj) {say('Move closer to a roadside stop or camp.');return;}
  if(state.driving){say('Stop and exit the vehicle first.');return;}
  if(obj.type==='car') return openMenu('Cargo');
  if(obj.type==='camp') return openMenu('Camp');
  if(obj.type==='parked'){
    delete state.parked[obj.id];switchCar(obj.car,obj.id);return;
  }
  if(obj.type==='spring'){
    if(state.bag.bottle&&state.bag.filter&&weight(state.bag)+.6<=16.0001){add(state.bag,'bottle',-1);add(state.bag,'water',1);say('Filled a bottle with filtered water.');}
    else {change('water',30);say('Drank spring water. Bring an empty bottle and filter to fill it.');}
    if(state.bag.fishingRod&&state.visited[obj.id+':fished']!==state.day&&take('fish')){
      state.visited[obj.id+':fished']=state.day;say('Caught a river fish.');
    }
    save();return;
  }
  if(obj.type==='wreck' && state.visited[obj.id] && !state.visited[obj.id+':car']){
    state.visited[obj.id+':car']=true;
    const car=newVehicle(cell(obj.segment*97)<.5?'pickup':'camper',obj.x,obj.z);
    car.condition=58;switchCar(car,obj.id);return;
  }
  if(state.visited[obj.id]){say('You already searched this stop.');return;}
  const pool=loot[{layby:0,shed:1,grove:2,wreck:1}[obj.type]];
  const regular=pool[Math.floor(cell(obj.segment*61)*pool.length)];
  const mod=state.mods.find((mod,index)=>cell(obj.segment*17+index)<mod.lootChance);
  const id=mod?.item.id||regular;
  const count=id==='wood'||id==='scrap'||id==='cloth'?2:1;
  if(!take(id,count)){say('Pack full. Store supplies in your vehicle.');return;}
  state.visited[obj.id]=true;
  say('Found '+count+' × '+def(id)[0]+(obj.type==='wreck'?' · use again to claim the vehicle.':'.'));
  save();
}
function switchCar(car,id){
  state.parked['vehicle:'+id+':'+Date.now()]=state.car;
  state.car=car;save();say('Now using '+vehicles[car.type].name+'. Your other vehicle stays here.');
}
function toggleSeat(){
  if(state.driving){
    if(Math.abs(speed)>3){say('Slow down before getting out.');return;}
    state.car.x=state.x;state.car.z=state.z;state.driving=false;speed=0;say('On foot.');
  }else{
    if(distance(state.car)>8){say('Move closer to your vehicle.');return;}
    state.x=state.car.x;state.z=state.car.z;state.driving=true;say(vehicles[state.car.type].name);
  }
  save();
}
function useItem(id){
  const [,,effect,n]=def(id);
  if(effect==='refuel'||effect==='repair'){
    if(distance(state.car)>8){say('Move closer to your vehicle.');return;}
    const key=effect==='repair'?'condition':'fuel', limit=key==='fuel'?vehicles[state.car.type].tank:100;
    if(state.car[key]>=limit){say('Already full.');return;}
    state.car[key]=Math.min(limit,state.car[key]+n);
  }else{
    const key={drink:'water',eat:'food',heal:'health'}[effect];
    if(state[key]>=100){say('Already full.');return;}
    change(key,n);
  }
  add(state.bag,id,-1);
  if(id==='water') add(state.bag,'bottle',1);
  save();renderMenu();
}
function buildCamp(){
  if(state.driving||state.bag.wood<2){say('Exit the vehicle and gather two firewood.');return;}
  if(Math.abs(state.x-road(state.z))<9){say('Find a spot off the roadway.');return;}
  if(Object.values(state.camps).some(camp=>distance(camp)<14)){say('There is already a camp here.');return;}
  const id='camp:'+Object.keys(state.camps).length;
  state.camps[id]={id,type:'camp',x:state.x,z:state.z,size:3,planted:null};
  add(state.bag,'wood',-2);save();renderMenu();
}
const keys = new Set();
const turn = () => {if(Math.abs(speed)>3){say('Slow down before turning around.');return;}state.dir*=-1;speed=0;};
function button(label,action,disabled=false){
  const b=document.createElement('button');b.type='button';b.textContent=label;b.disabled=disabled;b.onclick=action;return b;
}
function paragraph(value){const p=document.createElement('p');p.textContent=value;el('content').append(p);}
function row(label,...buttons){
  const r=document.createElement('div');r.className='row';const span=document.createElement('span');
  span.textContent=label;r.append(span,...buttons);el('content').append(r);
}
function openMenu(tab='Pack'){selectedTab=tab;keys.clear();panel.hidden=false;renderMenu();}
function closeMenu(){panel.hidden=true;keys.clear();el('notice').textContent='';}
function sleep(){
  const hours=(29-state.hour)%24||24;
  advance(hours);change('energy',100);change('food',-hours*1.3);change('water',-hours*1.8);save();renderMenu();
}
function renderMenu(){
  el('panelTitle').textContent=selectedTab;
  el('tabs').replaceChildren(...['Pack','Cargo','Craft','Camp','Mods','Trip'].map(tab=>button(tab,()=>openMenu(tab),tab===selectedTab)));
  el('content').replaceChildren();
  const bag=state.bag, car=state.car;
  if(selectedTab==='Pack'){
    paragraph(weight(bag).toFixed(1)+' / 16 kg');
    for(const [id,n] of Object.entries(bag)){
      const item=def(id);if(!item) continue;
      const action=item[2]?button('Use',()=>useItem(id)):id==='lantern'?button(nightLamp?'Turn off':'Light',()=>{nightLamp=!nightLamp;renderMenu();}):null;
      row(item[0]+' × '+n,...(action?[action]:[]),button('Drop',()=>{add(bag,id,-1);save();renderMenu();}));
    }
  }else if(selectedTab==='Cargo'){
    const spec=vehicles[car.type];
    paragraph(spec.name+' · '+weight(car.cargo).toFixed(1)+' / '+spec.cap+' kg · fuel '+Math.round(car.fuel)+' / '+spec.tank+' L');
    if(distance(car)>8){paragraph('Move closer to the vehicle to open cargo.');return;}
    for(const id of new Set([...Object.keys(bag),...Object.keys(car.cargo)])){
      if(!def(id)) continue;
      const move=(from,to,cap)=>{if(weight(to)+def(id)[1]>cap+.0001){say('No room.');return;}add(from,id,-1);add(to,id,1);save();renderMenu();};
      row(def(id)[0]+' · pack '+(bag[id]||0)+' / cargo '+(car.cargo[id]||0),
        button('Store',()=>move(bag,car.cargo,spec.cap),!bag[id]),button('Take',()=>move(car.cargo,bag,16),!car.cargo[id]));
    }
  }else if(selectedTab==='Craft'){
    const atCamp=nearbyCamp()&&!state.driving;
    for(const [id,ingredients] of Object.entries(recipes)){
      const complete=Object.entries(ingredients).every(([key,n])=>(bag[key]||0)>=n);
      row(def(id)[0]+' · '+Object.entries(ingredients).map(([key,n])=>n+' '+def(key)[0]).join(', ')+(id==='meal'?' · campfire':''),
        button('Craft',()=>{
          const consumed=Object.entries(ingredients).reduce((sum,[key,n])=>sum+def(key)[1]*n,0);
          if(weight(bag)-consumed+def(id)[1]>16.0001){say('Pack full.');return;}
          Object.entries(ingredients).forEach(([key,n])=>add(bag,key,-n));
          add(bag,id,1);save();renderMenu();
        },!complete||(id==='meal'&&!atCamp)));
    }
  }else if(selectedTab==='Camp'){
    const camp=nearbyCamp();
    if(!camp||state.driving){
      if(!state.driving&&car.type==='camper'&&distance(car)<8){
        row('Camper bunk · sleep until 05:00',button('Sleep',sleep));
      }
      row('Campfire and garden · 2 Firewood',button('Set up camp',buildCamp));return;
    }
    row('Sleep until 05:00 · requires bedroll',button('Sleep',sleep,!bag.bedroll));
    row('Rest for one hour',button('Rest',()=>{advance(1);change('energy',20);change('water',-4);save();renderMenu();}));
    if(camp.planted===null){
      row('Garden · 1 seed and 1 water',button('Plant',()=>{
        add(bag,'seed',-1);add(bag,'water',-1);camp.planted=absoluteHour();save();renderMenu();
      },!bag.seed||!bag.water));
    }else{
      const remaining=Math.max(0,24-(absoluteHour()-camp.planted));
      row(remaining?'Garden · ready in '+Math.ceil(remaining)+' hours':'Garden · ripe',button('Harvest',()=>{
        if(!take('vegetables',3)){say('Pack full.');return;}
        camp.planted=null;save();renderMenu();
      },remaining>0));
    }
  }else if(selectedTab==='Mods'){
    paragraph('Import a JSON mod to add forage and tune how often it appears at roadside stops.');
    row('Enable a mod',button('Import JSON',()=>el('import').click()),button('Example',downloadExample));
    for(const mod of state.mods) row(mod.item.data[0]+' · '+Math.round(mod.lootChance*100)+'% chance',
      button('Remove',()=>{
        if(bag[mod.item.id]||[car,...Object.values(state.parked)].some(v=>v.cargo[mod.item.id])){
          say('Use or drop all copies of this item before removing the mod.');return;
        }
        state.mods=state.mods.filter(existing=>existing!==mod);save();renderMenu();
      }));
  }else{
    paragraph('WASD / arrows to move · E use · F enter/exit · R turn · Tab pack. On touch, use the controls along the bottom.');
    paragraph('Stop at shelters for supplies. Walk off the road to camp. Wrecks can contain a pickup or a camper.');
    row('World seed '+state.seed,button('Save trip',()=>save(true)),button('New trip',()=>{
      if(!confirm('Start a new trip and replace your saved route?')) return;
      const mods=state.mods;state=fresh();state.mods=mods;speed=0;save();closeMenu();
    }));
  }
}
const example={version:1,item:{id:'prickly-pear',name:'Prickly pear',weight:.3,effect:'drink',value:18},lootChance:.22};
function downloadExample(){
  const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([JSON.stringify(example,null,2)],{type:'application/json'}));
  link.download='dustbound-mod.json';
  if(/; wv\)/.test(navigator.userAgent)){
    const pre=document.createElement('pre');pre.textContent=JSON.stringify(example,null,2);
    if(!el('content').querySelector('pre')) el('content').append(pre);
  }else link.click();
  setTimeout(()=>URL.revokeObjectURL(link.href),1000);
}
el('import').onchange=async event=>{
  const file=event.target.files[0];event.target.value='';
  if(!file)return;
  try{
    if(file.size>16384) throw Error('Mod files must be 16 KB or smaller.');
    const mod=JSON.parse(await file.text()), i=mod?.item;
    if(mod?.version!==1||typeof i?.id!=='string'||!/^[-a-z0-9]{3,32}$/.test(i.id)||def(i.id)||
      typeof i.name!=='string'||!i.name.trim()||i.name.length>48||!Number.isFinite(i.weight)||i.weight<.05||i.weight>5||
      !['eat','drink','heal'].includes(i.effect)||!Number.isFinite(i.value)||i.value<1||i.value>100||
      !Number.isFinite(mod.lootChance)||mod.lootChance<.01||mod.lootChance>1||state.mods.length>=16){
      throw Error('Invalid mod. Check the example, use a unique item ID, and keep at most 16 enabled mods.');
    }
    state.mods.push({item:{id:i.id,data:[i.name.trim(),i.weight,i.effect,i.value]},lootChance:mod.lootChance});save();renderMenu();say('Mod enabled.');
  }catch(error){say(error.message);}
};
el('pack').onclick=()=>panel.hidden?openMenu():closeMenu();
el('close').onclick=closeMenu;
el('seat').onclick=()=>{if(panel.hidden)toggleSeat();};
el('interact').onclick=()=>{if(panel.hidden)useWorld();};
el('turn').onclick=()=>{if(panel.hidden)turn();};
const keyName = event => ({ArrowUp:'w',ArrowDown:'s',ArrowLeft:'a',ArrowRight:'d'}[event.key]||event.key.toLowerCase());
addEventListener('keydown',event=>{
  const key=keyName(event);
  if(key==='escape'){closeMenu();return;}
  if(key==='tab'&&panel.hidden){event.preventDefault();openMenu();return;}
  if(!panel.hidden||!['w','s','a','d','e','f','r'].includes(key))return;
  event.preventDefault();keys.add(key);
  if(event.repeat)return;
  if(key==='e')useWorld();if(key==='f')toggleSeat();if(key==='r')turn();
});
addEventListener('keyup',event=>keys.delete(keyName(event)));
addEventListener('blur',()=>keys.clear());
for(const b of document.querySelectorAll('[data-key]')){
  b.onpointerdown=event=>{if(panel.hidden){b.setPointerCapture(event.pointerId);keys.add(b.dataset.key);}};
  b.onlostpointercapture=b.onpointerup=b.onpointercancel=()=>keys.delete(b.dataset.key);
}
function simulate(dt){
  const forward=Number(keys.has('w'))-Number(keys.has('s'));
  const steer=Number(keys.has('d'))-Number(keys.has('a'));
  const car=state.car, spec=vehicles[car.type];
  if(state.driving){
    const dirt=Math.abs(state.x-road(state.z))>7;
    const maximum=spec.speed*(dirt?.53:1)*(.45+.55*car.condition/100);
    const target=car.fuel>0&&car.condition>0?forward*(forward<0?8:maximum):0;
    speed=mix(speed,target,Math.min(1,dt*(forward?1.7:3.3)));
    let z=clamp(state.z+speed*dt*state.dir,-1000000,1000000);
    const lateral=clamp(state.x-road(state.z)+steer*state.dir*(Math.abs(speed)*.46)*dt,-150,150);
    state.z=z;state.x=road(z)+lateral;
    car.z=state.z;car.x=state.x;
    car.fuel=Math.max(0,car.fuel-Math.abs(speed)*dt*(dirt?.005:.003));
    if(dirt&&Math.abs(speed)>5)car.condition=Math.max(0,car.condition-dt*.10);
  }else{
    const walk=state.energy>0?6.5:3;
    const lateral=state.x-road(state.z);
    state.z=clamp(state.z+forward*walk*dt*state.dir,-1000000,1000000);
    state.x=road(state.z)+clamp(lateral+steer*dt*walk*state.dir,-150,150);
  }
  const active=forward||steer;
  const conditions=weather();
  if(!state.driving&&conditions==='Rain'&&!state.bag.jacket)change('energy',-dt*.14);
  if(!state.driving&&conditions==='Dust')change('water',-dt*.12);
  advance(dt*.026);
  change('food',-dt*(active?.072:.024));change('water',-dt*(active?.099:.031));change('energy',-dt*(active?.055:.013));
  if(!state.food||!state.water) change('health',-dt*.38);
  if(!state.health){
    state.health=35;state.food=35;state.water=35;state.energy=40;state.driving=false;
    state.x=car.x+2;state.z=car.z;advance(5);speed=0;say('You passed out and recovered beside your vehicle.');save();
  }
}
let width=0,height=0,center=0,horizon=0,focal=0;
const project=(x,z)=>{
  const depth=(z-state.z)*state.dir+8;
  if(depth<2)return null;
  const scale=focal/depth;
  return [center+(x-state.x)*state.dir*scale,horizon+2.8*scale,scale];
};
function polygon(color,points){
  ctx.fillStyle=color;ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fill();
}
function sprite(obj){
  const pos=project(obj.x,obj.z);if(!pos)return;
  const [x,y,s]=pos;
  if(x < -80*s || x > width+80*s || y>height+20*s)return;
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  if(obj.type==='tree'){
    ctx.fillStyle='#443c2a';ctx.fillRect(-.26,-obj.size,.52,obj.size);
    polygon('#354d35',[[-1.8,0],[-1.5,-obj.size*.55],[-.1,-obj.size],[1.2,-obj.size*.65],[1.8,-.3]]);
    polygon('#536343',[[-1.5,-obj.size*.55],[-.1,-obj.size],[.15,-obj.size*.34],[-1.8,0]]);
  }else if(obj.type==='grass'){
    polygon(obj.color,[[-.8,0],[-.6,-.6],[0,-.2],[.15,-.9],[.36,-.22],[.9,-.57],[.6,0]]);
  }else if(obj.type==='rock'){
    polygon('#776b51',[[-1,0],[-.75,-.45],[-.28,-.65],[.48,-.53],[.88,0]]);
    polygon('#9f9170',[[-.75,-.45],[-.28,-.65],[.48,-.53],[0,-.36]]);
  }else if(obj.type==='camp'){
    polygon('#8e6246',[[-2.7,0],[-1.4,-1.6],[.1,0]]);
    polygon('#ef9f4a',[[.8,0],[.7,-.45],[1.1,-.33],[1.4,-.95],[1.7,-.3],[1.9,-.46],[2,0]]);
    if(obj.planted!==null){ctx.fillStyle='#6c8550';ctx.fillRect(2.3,-.4,1.5,.4);}
  }else if(['car','parked','wreck'].includes(obj.type)){
    const car=obj.car||obj, color=vehicles[car.type]?.color||'#775745';
    ctx.fillStyle='#222620';ctx.fillRect(-1.3,-.58,.44,.58);ctx.fillRect(.86,-.58,.44,.58);
    ctx.fillStyle=color;ctx.fillRect(-1.4,-1.1,2.8,.85);
    polygon(color,[[-1.05,-1.08],[-.8,-1.95],[.76,-1.95],[1.03,-1.08]]);
    ctx.fillStyle='#9caea1';ctx.fillRect(-.7,-1.75,1.4,.42);
    ctx.fillStyle='#e2a471';ctx.fillRect(-1.23,-.8,.29,.17);ctx.fillRect(.94,-.8,.29,.17);
  }else if(obj.type==='spring'){
    polygon('#759a94',[[-3,0],[-2,-.75],[1,-.95],[3,-.42],[2.2,0]]);
    polygon('#aec0b3',[[-2,-.2],[-.8,-.48],[1.6,-.53],[.6,-.3]]);
  }else if(obj.type==='grove'){
    for(let i=-2;i<=2;i++){
      ctx.fillStyle=i%2?'#657049':'#4e6243';ctx.beginPath();ctx.ellipse(i*.85,-.67,.85,1.1,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#b87c64';ctx.fillRect(i*.85-.23,-.95,.15,.15);
    }
  }else{
    const wide=obj.type==='shed'?3:2;
    ctx.fillStyle='#a78f68';ctx.fillRect(-wide,-2.3,wide*2,2.3);
    ctx.fillStyle='#46473a';ctx.fillRect(-.55,-1.65,1.1,1.65);
    polygon('#6a5643',[[-wide-.42,-2.2],[0,-3.2],[wide+.42,-2.2]]);
  }
  if(obj.id?.startsWith('stop:')&&s>1.25){
    ctx.font=.62+'px system-ui';ctx.textAlign='center';ctx.fillStyle='#19231a';
    ctx.fillRect(-2,-4.35,4,1);ctx.fillStyle='#ffedbc';
    ctx.fillText((state.visited[obj.id]?'✓ ':'')+obj.type.toUpperCase(),0,-3.65);
  }
  ctx.restore();
}
function draw(){
  const dpr=Math.min(devicePixelRatio||1,2);
  const w=canvas.clientWidth,h=canvas.clientHeight;
  if(w!==width||h!==height||canvas.width!==Math.round(w*dpr)){
    width=w;height=h;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);center=w/2;horizon=h*.43;focal=Math.min(w,h)*.87;
  const daylight=clamp((Math.sin((state.hour-6)/24*Math.PI*2)+.14)*2,0,1);
  const sky=ctx.createLinearGradient(0,0,0,horizon+30);
  sky.addColorStop(0,daylight>.1?'#567a83':'#121e37');sky.addColorStop(1,daylight>.1?'#dfc593':'#45505a');
  ctx.fillStyle=sky;ctx.fillRect(0,0,w,horizon+2);
  const sunPhase=(state.hour-6)/12;
  if(sunPhase>=0&&sunPhase<=1){
    ctx.fillStyle='#ffe0a0';ctx.beginPath();ctx.arc(w*(.11+.78*sunPhase),horizon-12-h*.28*Math.sin(Math.PI*sunPhase),Math.max(9,w*.021),0,Math.PI*2);ctx.fill();
  }else for(let i=0;i<60;i++){
    ctx.fillStyle=i%3?'#cad2b7':'#f4dfa5';ctx.fillRect(hash(i*73)*w,hash(i*77+1)*horizon*.9,i%5?1:2,1);
  }
  for(let layer=0;layer<3;layer++){
    const points=[[0,horizon+2]];
    for(let i=0;i<=44;i++){
      const edge=i/44, shift=state.z*(.00014+layer*.00012);
      const top=(.39+.18*Math.sin((edge+shift)*16+layer)+.19*Math.sin((edge+shift)*39-layer));
      points.push([edge*w,horizon-top*h*(.12+layer*.045)]);
    }
    points.push([w,horizon+2]);polygon(['#9d9b79','#7d8668','#647453'][layer],points);
  }
  ctx.fillStyle='#827e54';ctx.fillRect(0,horizon,w,h-horizon);
  for(let depth=446;depth>=-6;depth-=4){
    const z0=state.z+depth*state.dir,z1=z0+4*state.dir, r0=road(z0),r1=road(z1);
    const strip=(offset0,offset1,color)=>polygon(color,[project(r0+offset0,z0),project(r0+offset1,z0),project(r1+offset1,z1),project(r1+offset0,z1)]);
    const stripe=Math.floor(z0/8)%2;
    strip(-9,9,stripe?'#ab956a':'#a68f64');strip(-6.4,6.4,stripe?'#57534a':'#555147');
    strip(-6.08,-5.93,'#c7b78f');strip(5.93,6.08,'#c7b78f');
    if(stripe)strip(-.10,.10,'#d7ad66');
  }
  const sprites=[];
  const first=Math.floor((state.z-6)/18), last=Math.floor((state.z+state.dir*440)/18);
  for(let n=Math.min(first,last)-1;n<=Math.max(first,last)+1;n++){
    for(let type=0;type<6;type++){
      const seed=n*103+type*13,z=n*18+cell(seed+1)*18;
      const x=road(z)+(type%2?1:-1)*(11+cell(seed+2)*105);
      sprites.push({x,z,type:type<2?'tree':type===2?'rock':'grass',size:2.4+cell(seed+3)*4,color:cell(seed)<.5?'#a7985f':'#656a44'});
    }
  }
  for(let segment=Math.floor(Math.min(state.z,state.z+state.dir*450)/175)-1;segment<=Math.floor(Math.max(state.z,state.z+state.dir*450)/175)+1;segment++)sprites.push(stop(segment));
  sprites.push(...Object.values(state.camps),...Object.values(state.parked).map(car=>({type:'parked',x:car.x,z:car.z,car})));
  if(!state.driving)sprites.push({type:'car',x:state.car.x,z:state.car.z,car:state.car});
  sprites.sort((a,b)=>(b.z-a.z)*state.dir).forEach(sprite);
  const conditions=weather();
  if(conditions==='Rain'){
    ctx.strokeStyle='#d6e5de66';ctx.lineWidth=1;ctx.beginPath();
    const tick=performance.now();
    for(let i=0;i<75;i++){
      const x=(hash(i*97)*w+tick*.15)%w,y=(hash(i*117)*h+tick*.65)%h;
      ctx.moveTo(x,y);ctx.lineTo(x-5,y-15);
    }
    ctx.stroke();
  }else if(conditions==='Dust'){
    const fog=ctx.createLinearGradient(0,horizon-80,0,h);
    fog.addColorStop(0,'#ce9e6422');fog.addColorStop(.3,'#d9b37d9c');fog.addColorStop(1,'#be985437');
    ctx.fillStyle=fog;ctx.fillRect(0,horizon-80,w,h);
  }
  if(daylight<1){
    ctx.fillStyle='rgba(15,23,45,'+(.67*(1-daylight))+')';ctx.fillRect(0,0,w,h);
    if(state.driving||nightLamp&&state.bag.lantern){
      const beam=ctx.createRadialGradient(center,h*.77,1,center,h*.76,h*.42);
      beam.addColorStop(0,'#f4e7ae61');beam.addColorStop(1,'#f4e7ae00');
      ctx.fillStyle=beam;ctx.fillRect(0,horizon,w,h-horizon);
    }
  }
  if(state.driving){
    const car=state.car;
    polygon('#232722',[[w*.16,h],[w*.25,h*.875],[w*.75,h*.875],[w*.84,h]]);
    polygon(vehicles[car.type].color,[[w*.25,h*.88],[w*.31,h*.83],[w*.69,h*.83],[w*.75,h*.88]]);
    ctx.strokeStyle='#ada58a';ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(w*.39,h*.987,w*.095,h*.056,0,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='#f3dfaa';ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.fillText(Math.round(Math.abs(speed)*3.6)+' km/h',center,h*.924);
  }else{
    ctx.fillStyle='#ead9a7';ctx.fillRect(center-3,h*.57,6,1);ctx.fillRect(center,h*.57-3,1,7);
  }
}
let last=performance.now(),hudTime=0,saveTime=0;
function frame(now){
  const dt=Math.min((now-last)/1000,.07);last=now;
  if(panel.hidden&&document.visibilityState==='visible')simulate(dt);
  draw();
  if(now-hudTime>120){
    hudTime=now;
    const clock=Math.floor(state.hour).toString().padStart(2,'0')+':'+Math.floor(state.hour%1*60).toString().padStart(2,'0');
    el('meters').textContent='Day '+(state.day+1)+' '+clock+' · '+weather()+' · '+Math.round(state.health)+' HP · Food '+Math.ceil(state.food)+' · Water '+Math.ceil(state.water)+' · Energy '+Math.ceil(state.energy)+(state.driving?' · '+Math.ceil(state.car.fuel)+' L · Condition '+Math.ceil(state.car.condition):' · On foot');
    const obj=nearby(), next=nextStop();
    el('hint').textContent=now<statusUntil?status:obj?names[obj.type]+' · '+(state.driving?'exit first':'Use / E'):
      next.type.toUpperCase()+' '+Math.round(distance(next))+' m '+((next.x-road(next.z))*state.dir<0?'left':'right');
    el('seat').textContent=state.driving?'Exit':'Enter';
  }
  if(now-saveTime>8000){saveTime=now;save();}
  requestAnimationFrame(frame);
}
function nextStop(){
  const n=Math.floor(state.z/175), a=stop(n);
  return (a.z-state.z)*state.dir>5?a:stop(n+state.dir);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden){keys.clear();save();}});
addEventListener('pagehide',()=>save());
requestAnimationFrame(frame);
</script></body></html>
